<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Controle de Carenagens</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f5f6f8;

            font-family: Arial, Helvetica, sans-serif;
        }

        .login {
            width: 390px;

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 14px;

            padding: 35px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.07);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 55px;
            height: 55px;

            margin: 0 auto 12px;

            background: #d9271c;

            color: white;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            margin: 0;

            color: #111827;

            font-size: 22px;
        }

        .subtitulo {
            margin-top: 7px;

            color: #8a93a1;

            font-size: 12px;
        }

        .campo {
            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 12px;

            font-weight: 600;

            color: #374151;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #dfe3e8;

            border-radius: 7px;

            outline: none;

            font-size: 13px;
        }

        input:focus {
            border-color: #d9271c;

            box-shadow: 0 0 0 2px rgba(217, 39, 28, 0.08);
        }

        button {
            width: 100%;

            border: 0;

            padding: 12px;

            border-radius: 7px;

            background: #d9271c;

            color: white;

            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            background: #bb2118;
        }

        .erro {
            background: #fae8e6;

            color: #b42318;

            border-radius: 7px;

            padding: 10px;

            margin-bottom: 18px;

            font-size: 12px;

            text-align: center;
        }

        .rodape {
            margin-top: 25px;

            text-align: center;

            color: #9ca3af;

            font-size: 10px;
        }

    </style>

</head>

<body>

    <div class="login">

        <div class="logo">

            <div class="logo-icon">
                A
            </div>

            <h1>
                AVELLOZ
            </h1>

            <div class="subtitulo">
                Controle de Carenagens
            </div>

        </div>

        {% if erro %}

            <div class="erro">
                {{ erro }}
            </div>

        {% endif %}

        <form method="POST">

            <div class="campo">

                <label>
                    Usuário
                </label>

                <input
                    type="text"
                    name="usuario"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>

            <div class="campo">

                <label>
                    Senha
                </label>

                <input
                    type="password"
                    name="senha"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button type="submit">
                Entrar
            </button>

        </form>

        <div class="rodape">
            Sistema de Carenagens • Versão 1.0
        </div>

    </div>

</body>

</html>
